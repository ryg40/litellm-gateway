model_list:
  - model_name: gpt-6-luna
    litellm_params:
      model: chatgpt/responses/gpt-6-luna
      timeout: 540
      stream_timeout: 540
    model_info:
      mode: responses
      supports_native_streaming: true
      supports_xhigh_reasoning_effort: true
      supports_function_calling: true
      supports_tool_choice: true
  - model_name: gpt-6-sol
    litellm_params:
      model: chatgpt/responses/gpt-6-sol
      timeout: 540
      stream_timeout: 540
    model_info:
      mode: responses
      supports_native_streaming: true
      supports_xhigh_reasoning_effort: true
      supports_function_calling: true
      supports_tool_choice: true
  - model_name: gpt-6.1-sol
    litellm_params:
      model: chatgpt/responses/gpt-6.1-sol
      timeout: 540
      stream_timeout: 540
    model_info:
      mode: responses
      supports_native_streaming: true
      supports_reasoning: true
      supports_xhigh_reasoning_effort: true
      supports_function_calling: true
      supports_tool_choice: true
  # Not a route: this entry only registers the key responses/gpt-6.1-sol for the
  # parameter check (docs/image.md, "A new model"). Its api_base answers nothing.
  - model_name: gpt-6.1-sol-capabilities
    litellm_params:
      model: openai/responses/gpt-6.1-sol
      api_base: http://127.0.0.1:9/v1
      api_key: not-a-route
    model_info:
      id: responses/gpt-6.1-sol
      litellm_provider: openai
      mode: responses
      supports_reasoning: true
      supports_xhigh_reasoning_effort: true
      supports_function_calling: true
      supports_tool_choice: true
  - model_name: gpt-6-astra
    litellm_params:
      model: chatgpt/responses/gpt-6-astra
      timeout: 540
      stream_timeout: 540
    model_info:
      mode: responses
      supports_native_streaming: true
general_settings:
  master_key: os.environ/CODEX_MASTER_KEY
  disable_spend_logs: true
litellm_settings:
  request_timeout: 540
  num_retries: 0
  set_verbose: false
